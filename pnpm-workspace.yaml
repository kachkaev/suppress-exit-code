# Collapse compatible duplicate versions whenever pnpm writes the lockfile, so every install keeps it
# as lean as `pnpm dedupe` would. This replaces the `pnpm dedupe --check` CI step: the two algorithms
# can break ties differently, so the check could fail a lockfile a plain `pnpm install` just wrote.
autoDedupe: true

# TEMPORARY, see https://github.com/kachkaev/reusable-stuff/issues/347: @kachkaev/eslint-config-base v2
# installs eslint-plugin-import from a git snapshot because the plugin has no ESLint 10-compatible
# release on npm yet, and pnpm blocks git-hosted transitive dependencies by default. While this is
# off, review lockfile diffs in dependency PRs for unexpected codeload.github.com tarballs. Remove
# once the config is back on npm releases (tracked in the issue above).
blockExoticSubdeps: false

# Install packages only after they have been out for at least 8 hours, which
# reduces exposure to malicious releases that tend to get unpublished quickly.
# This must stay in sync with the `minimumReleaseAge` floor in the shared
# Renovate preset (github>kachkaev/reusable-stuff:renovate-preset), so that
# Renovate never proposes a version pnpm would refuse to lock.
minimumReleaseAge: 480

# Packages published from kachkaev/reusable-stuff are our own, so there is no reason to wait for
# pnpm’s minimum release age before adopting a release.
minimumReleaseAgeExclude:
  - "@kachkaev/*"

# Have `pnpm add` also add the matching `@types/*` package to devDependencies, when one exists
saveTypes: true
