# Install packages only after they have been out for at least 8 hours, which
# reduces exposure to malicious releases that tend to get unpublished quickly.
# This must stay in sync with the `minimumReleaseAge` floor in the shared
# Renovate preset (github>kachkaev/reusable-stuff:renovate-preset), so that
# Renovate never proposes a version pnpm would refuse to lock.
minimumReleaseAge: 480

# The Changesets v3 line was published on the day this file was added, so pnpm’s
# default `minimumReleaseAge` gate rejects it. These entries opt the release
# tooling out of that gate; they can be dropped once the versions have aged.
minimumReleaseAgeExclude:
  - "@changesets/apply-release-plan@8.0.0"
  - "@changesets/assemble-release-plan@7.0.0"
  - "@changesets/changelog-git@1.0.0"
  - "@changesets/changelog-github@1.0.0"
  - "@changesets/cli@3.0.0"
  - "@changesets/config@4.0.0"
  - "@changesets/errors@1.0.0"
  - "@changesets/get-dependents-graph@3.0.0"
  - "@changesets/get-github-info@1.0.0"
  - "@changesets/git@4.0.0"
  - "@changesets/parse@1.0.0"
  - "@changesets/pre@3.0.0"
  - "@changesets/read@1.0.0"
  - "@changesets/should-skip-package@1.0.0"
  - "@changesets/types@7.0.0"
  - "@changesets/write@1.0.0"
