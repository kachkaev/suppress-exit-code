name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install

      - name: Load CSpell cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: cspell-${{ github.run_id }}
          path: node_modules/.cache/cspell
          restore-keys: |
            cspell-

      - name: Run pnpm lint:cspell
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:cspell; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you do not see them, try merging target branch into yours.'
            echo 'You can add exceptions to `cspell-words.txt`, if necessary.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:eslint
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:eslint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:eslint` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:knip
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:knip; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:knip` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:markdownlint
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:markdownlint; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:markdownlint` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:pnpm-dedupe
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:pnpm-dedupe; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Some dependencies can be deduplicated, which will make pnpm-lock.yaml'
            echo 'lighter and potentially save us from unexplainable bugs.'
            echo 'Please run `pnpm fix:pnpm-dedupe` locally and commit pnpm-lock.yaml.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Load Prettier cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: prettier-${{ github.run_id }}
          path: node_modules/.cache/prettier
          restore-keys: |
            prettier-

      - name: Run pnpm lint:prettier
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:prettier; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Try running `pnpm fix:prettier` locally to apply autofixes.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

      - name: Run pnpm lint:tsc
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm lint:tsc; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above errors locally for the check to pass.'
            echo 'If you don’t see them, try merging target branch into yours.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

  integration-tests:
    name: Integration tests (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which does not understand the
    # `if ! command` syntax used to print remediation hints below
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: pnpm install

      - name: Run pnpm test
        if: ${{ success() || failure() }}
        run: |
          if ! pnpm test; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'Please fix the above test failures locally for the check to pass.'
            echo 'Note that this package is cross-platform, so a failure can be'
            echo 'specific to ${{ matrix.os }} and / or to node ${{ matrix.node }}.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi

  package-smoke-test:
    name: Smoke-test the packed package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows runners default to PowerShell, which does not understand the
    # `if ! command` syntax used to print remediation hints below
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions

      # The tests run `main.js` from the repository, so this is the only check
      # of what npm actually publishes. The tarball is installed with npm and
      # into a directory of its own, which makes the binary reachable through
      # the `node_modules/.bin` shims a consumer gets – on Windows a `.cmd` one.
      #
      # `pnpm install` is not needed beforehand: nothing is built and the
      # `prepare` script exits early when `CI` is set. The commands run in a
      # nested bash so that `set -e` applies – an `if !` condition switches it
      # off for everything it wraps, subshells included
      - name: Pack the package and run the binary from a scratch install
        if: ${{ success() || failure() }}
        run: |
          if ! bash -euo pipefail -c '
            pnpm pack --out ../suppress-exit-code.tgz
            mkdir ../smoke-test
            cd ../smoke-test
            npm init --yes
            npm install ../suppress-exit-code.tgz
            output=$(./node_modules/.bin/suppress-exit-code echo hello | tr -d "\r")
            test "$output" = hello
            npx suppress-exit-code node -e "process.exit(42)"
            npx suppress-exit-code definitely-not-a-real-command
          '; then
            echo ''
            echo ''
            echo 'ℹ️ ℹ️ ℹ️'
            echo 'The published package could not be installed or run on ${{ matrix.os }}.'
            echo 'Check `bin` and `files` in package.json, then reproduce locally with'
            echo '`pnpm pack` followed by `npm install` of the tarball elsewhere.'
            echo 'ℹ️ ℹ️ ℹ️'
            exit 1
          fi
