name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Git hooks are of no use on a throwaway checkout, so keep the `prepare` script
# from installing them: https://typicode.github.io/husky/how-to.html#ci-server-and-docker
env:
  HUSKY: 0

jobs:
  release:
    # npm trusted publishing is configured against this exact combination of
    # repository, workflow file name and environment. Renaming any of them
    # breaks publishing until the npm side is updated to match
    environment: release
    if: github.repository == 'kachkaev/suppress-exit-code'
    name: Release
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up pnpm and Node.js, install dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true

      - name: Verify lint
        run: pnpm lint

      - name: Verify tests
        run: pnpm test

      # npm scans a new version for malware for a few minutes before listing
      # it, so a run right after the one that published sees the version as
      # unpublished and fails with 409 Conflict on publishing it again. The
      # version's tag, which changesets pushes after publishing, does not lag.
      # Drop this check once changesets handles the scan window:
      # https://github.com/changesets/changesets/issues/2195
      - name: Check if the current version is already tagged
        id: version-tag
        run: |
          version=$(node --print "require('./package.json').version")
          if git rev-parse --quiet --verify "refs/tags/v$version" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release pull request or publish to npm
        # There is no floating `v2` tag for this action, so the pinned SHA is
        # the v2.0.0 release commit. v2 renamed every input it kept from v1
        # (`publish` → `publish-script` and so on), dropped `NPM_TOKEN` and
        # `.npmrc` handling in favor of npm trusted publishing, and no longer
        # reads a `GITHUB_TOKEN` environment variable – the token now comes
        # from the `github-token` input, which defaults to `github.token`.
        #
        # The action passes a `CHANGESETS_OUTPUT` environment variable to the
        # publish script and reads the file it points at to learn which tags to
        # push and which GitHub releases to create. `pnpm run` forwards the
        # environment to the script it runs, so `changeset publish` receives the
        # variable through `pnpm changesets:publish` without extra wiring
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: Version packages
          # An empty script makes the action skip publishing
          publish-script: ${{ steps.version-tag.outputs.exists != 'true' && 'pnpm changesets:publish' || '' }}
          version-script: pnpm changesets:version
